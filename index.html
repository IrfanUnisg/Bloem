<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://bloem.shop" />
    
    <!-- Primary Meta Tags -->
    <title>Bloem — Effortless Second-hand Fashion & Local Thrift Stores</title>
    <meta name="title" content="Bloem — Effortless Second-hand Fashion & Local Thrift Stores" />
    <meta name="description" content="Discover sustainable fashion by connecting with local thrift shops. Buy, sell, and explore second-hand clothes in your community." />
    <meta name="keywords" content="thrift stores, second-hand fashion, sustainable fashion, local shopping, circular economy" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloem.shop" />
    <meta property="og:title" content="Bloem — Effortless Second-hand Fashion & Local Thrift Stores" />
    <meta property="og:description" content="Discover sustainable fashion by connecting with local thrift shops. Buy, sell, and explore second-hand clothes in your community." />
    <meta property="og:image" content="https://bloem.shop/og-image.png" />
    <meta property="og:site_name" content="Bloem" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bloem.shop" />
    <meta name="twitter:title" content="Bloem — Effortless Second-hand Fashion & Local Thrift Stores" />
    <meta name="twitter:description" content="Discover sustainable fashion by connecting with local thrift shops." />
    <meta name="twitter:image" content="https://bloem.shop/og-image.png" />
    <meta name="twitter:creator" content="@bloemshop" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bloem",
      "url": "https://bloem.shop",
      "description": "Effortless second-hand fashion meets local thrift stores. Buy, sell, and discover sustainable style in your community.",
      "sameAs": [
        "https://twitter.com/bloemshop",
        "https://instagram.com/bloemshop",
        "https://facebook.com/bloemshop"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "url": "https://bloem.shop/contact"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bloem",
      "url": "https://bloem.shop",
      "description": "Effortless second-hand fashion meets local thrift stores.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bloem.shop/browse?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Content Security Policy for Stripe integration -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://m.stripe.network https://m.stripe.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://api.stripe.com https://m.stripe.network https://m.stripe.com https://*.supabase.co wss://*.supabase.co;
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://m.stripe.network;
      child-src 'self' https://js.stripe.com;
      worker-src 'self' blob:;
    ">
    
    <!-- Prevent flash of unstyled content -->
    <style>
      #root { 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column;
      }
      body { 
        margin: 0; 
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
